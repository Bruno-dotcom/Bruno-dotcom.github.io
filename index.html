<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruno Almeida — Cybersecurity Professional</title>
    <meta name="description" content="Bruno Almeida — Cybersecurity Professional. Security operations, offensive security and AI research. Explore the cybersecurity universe of Bruno Almeida.">
    <meta name="theme-color" content="#04050a">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=soundtrack-1">
</head>
<body>
    <canvas id="space" aria-hidden="true"></canvas>
    <div id="labels"></div>

    <header class="hud-top">
        <button class="brand" type="button" data-go="home">
            <span class="brand-mark">BA</span>
            <span class="brand-text">Bruno Almeida<small data-ui="role"></small></span>
        </button>
        <div class="hud-right">
            <div class="sound-control" id="sound-control">
               <button
    class="sound-toggle"
    id="sound-toggle"
    type="button"
    aria-pressed="false"
    aria-label="Play soundtrack"
    title="Play soundtrack"
>
    <span class="sound-bars" aria-hidden="true">
        <i></i><i></i><i></i>
    </span>

    <svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
            d="M4 10v4h4l5 4V6l-5 4H4Z"
            fill="currentColor"
        />

        <path
            d="M16 9c1.3 1.7 1.3 4.3 0 6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
        />

        <path
            d="M19 6c3 3.3 3 8.7 0 12"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
        />

        <path
            class="sound-icon-muted"
            d="M15.5 8.5l6 7m0-7l-6 7"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
        />
    </svg>
</button>

                <label class="sound-volume">
                    <span class="sr-only" data-ui="soundVolume">Soundtrack volume</span>
                    <input
                        id="sound-volume"
                        type="range"
                        min="0"
                        max="100"
                        step="1"
                        value="70"
                        aria-label="Soundtrack volume"
                    >
                </label>
            </div>

            <span class="readout" id="readout"></span>
        
            <div class="lang" role="group" aria-label="Language">
                <button type="button" data-lang="pt" aria-pressed="false">PT</button>
                <button type="button" data-lang="en" aria-pressed="true" class="active">EN</button>
            </div>
        </div>
    </header>

    <section id="intro" class="intro">
        <h1 aria-label="Bruno Almeida">Bruno<br><span>Almeida</span></h1>

        <p class="tagline" id="tagline-detail"></p>

        <p class="intro-lead" data-ui="lead"></p>

        <div class="actions">
            <button class="btn solid" type="button" data-go="0">
                <span data-ui="explore"></span> →
            </button>
        </div>

        <dl class="stats" id="stats"></dl>
    </section>

    <p class="hint" data-ui="hint"></p>

    <aside id="panel" class="panel" aria-hidden="true" aria-labelledby="panel-title">
        <div class="panel-head">
            <div class="panel-meta">
                <span id="panel-orbit"></span>
                <span id="panel-body"></span>
            </div>
            <button class="close" id="panel-close" type="button" aria-label="Close">✕</button>
        </div>
        <h2 id="panel-title"></h2>
        <div class="panel-content" id="panel-content"></div>
        <div class="panel-foot">
            <button class="btn ghost" id="prev" type="button">← <span data-ui="prev"></span></button>
            <button class="btn ghost" id="next" type="button"><span data-ui="next"></span> →</button>
        </div>
    </aside>

    <nav class="dock" id="dock" aria-label="Portfolio destinations"></nav>

    <nav class="moon-dock" id="moon-dock" aria-label="Jupiter research areas" aria-hidden="true">
        <button type="button" data-moon="io">
            <span>IO</span>
        </button>

        <button type="button" data-moon="europa">
            <span>EUROPA</span>
        </button>

        <button type="button" data-moon="ganymede">
            <span>GANYMEDE</span>
        </button>

        <button type="button" data-moon="callisto">
            <span>CALLISTO</span>
        </button>
    </nav>

    <!-- VOYAGER — DEEP-SPACE OPTICAL FEED -->
    <aside
        id="standby"
        class="standby voyager-panel"
        aria-hidden="true"
        role="dialog"
        aria-modal="false"
        aria-labelledby="standby-title"
    >
        <div class="standby-screen voyager-screen">
            <div class="standby-bars" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>

            <p class="standby-meta">
                <span data-ui="voyagerBrand">BA · VOYAGER 1</span>
                <span data-ui="standbySignal">A MESSAGE ACROSS SPACE</span>
            </p>

            <div class="voyager-content">
              
                <h2 id="standby-title" data-ui="standbyTitle">
                    A PALE BLUE DOT
                </h2>

    
                <div class="voyager-optical-system">
                    <div class="voyager-optical-header">
                        <span>VOYAGER IMAGING LINK · VGR-001</span>
                    </div>

                    <div class="voyager-video-frame">
                        <span class="voyager-optical-label">OPTICAL FEED</span>

                        <video
                            id="voyager-video"
                            playsinline
                            preload="metadata"
                            aria-label="Pale Blue Dot video"
                        >
                            <source
                                src="/files/Voyager/palido-ponto-azul.mp4"
                                type="video/mp4"
                            >
                            Your browser does not support HTML5 video.
                        </video>

                        <div class="voyager-start-overlay">
                            <button
                                id="voyager-start"
                                class="voyager-start-button"
                                type="button"
                                aria-label="Initiate video transmission"
                            >
                                <span class="voyager-play-icon">▶</span>
                                <span data-ui="voyagerStart">INITIATE TRANSMISSION</span>
                            </button>
                        </div>

                        <div class="voyager-optical-status">
                            <span class="voyager-status">
                                <span class="voyager-status-light"></span>
                                SIGNAL LOCK
                            </span>
                            <span>PALE BLUE DOT · 1990</span>
                        </div>
                    </div>
                </div>

                <div class="voyager-footer">
                    <span>EARTH · 1990</span>
                    <span class="voyager-signal" data-ui="voyagerFooter">
                        ONE PLANET. ONE HOME.
                    </span>
                </div>

                <p class="standby-note" data-ui="standbyNote">
                    Some discoveries change how we see everything.
                </p>
            </div>
        </div>

        <button class="close" id="standby-close" type="button" aria-label="Close">✕</button>
    </aside>

    <audio id="portfolio-soundtrack" loop preload="metadata">
        <source src="files/Audio/portfolio-soundtrack.mp3" type="audio/mpeg">
    </audio>

    <script src="js/three.min.js"></script>
    <script src="js/content.js?v=4"></script>
    <script src="js/translations.js?v=soundtrack-1"></script>
    <script src="js/space.js?v=voyager-restored-1"></script>
    <script src="js/fallback.js"></script>
    <script src="js/script.js?v=soundtrack-1"></script>
</body>
</html>
